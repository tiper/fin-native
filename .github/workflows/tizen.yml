name: Tizen library CI

# The Tizen platform's hosted library (docs/tizen.md; mk/platform-tizen.mk): links `libplx.so` (the `plx_platform_tizen` staticlib, a
# STATIC SDL2 + SDL2_ttf and nanosvg's rasterizer), builds the subtitle renderer `libass-plx` beside it (ci/build-libass.py, the webOS
# recipe) and checks what both produced. The x86_64 job verifies the emulator library.
# The ARMv7 job builds the release package. The link check proves it links against the expected system libraries
# a Tizen television has (`-z defs`), that its DT_NEEDED set, undefined symbols, exports and glibc ceiling are the allowlist's
# (`ci/check-tizen-so.py verify`), and that the C header and the .NET host agree on the header's `plx_host_*` exports (`ci/check-tizen-so.py abi`).
# Nothing here proves that the library RUNS on a television: that is the emulator's, run by hand (docs/tizen.md, "Build, install, launch").
#
# NOT A REQUIRED CHECK. `ci.yml`'s two required status names are untouched and do not wait for this workflow, and branch protection is not
# edited; it starts only for the paths below, which is also why it is its own workflow: `ci.yml`'s job set is pinned by ci/test_ci_split.py
# and its `changes` job gates every job behind one path filter. The cold-run cost is unmeasured (see the `timeout-minutes` note on the job).
#
# THE PATH FILTER names the files whose change can alter the link or the checks: `rust-modules/**` is in it because the library is the WHOLE
# application behind one platform crate (a new `extern` symbol anywhere in it is this link's undefined symbol), as simulators.yml's is for the
# same reason. Markdown under rust-modules is not.
#
# THE RUNNER IS PINNED to ubuntu-24.04 (glibc 2.39), not `-latest`: the library's glibc symbol floor is the build host's, and a runner image
# that moved on past the ceiling (`PLX_MAX_GLIBC`, default 2.40, the Tizen TV 10.0 emulator image's glibc) would stop the check, loudly. The
# pin keeps the link reproducible; the ceiling is what refuses a library the television's glibc could not load.

on:
  push:
    branches: [main, 'release/v*']
    paths: &tizen_paths
      - '.github/workflows/tizen.yml'
      - '.github/workflows/tizen-package.yml'
      - '.github/actions/webos-ndk/**'
      - 'ci/arm-cc.py'
      - 'src/compat/getauxval.c'
      - '.github/actions/apt-install/**'
      - '.github/actions/deps-cache/**'
      - '.github/actions/host-rust/**'
      - '.github/actions/rust-toolchain/**'
      - 'Makefile'
      - 'mk/platform-tizen.mk'
      - 'tizen/**'
      - 'rust-modules/**'
      - '!rust-modules/**/*.md'
      - 'src/svg.c'
      # The subtitle renderer the package carries (`tizen-libass`): its recipe, its facade sources and the fonts staged beside it.
      - 'ci/build-libass.sh'
      - 'ci/host-toolchain-id.sh'
      - 'ci/build-libass.py'
      - 'ci/stage-link-evidence.py'
      - 'ci/check-link-evidence.py'
      - 'ci/patches/libass-*.patch'
      - 'src/ass.c'
      - 'src/ass_fonts.c'
      - 'src/ass_text.c'
      - 'src/ass_internal.h'
      - 'src/ass_composite.h'
      - 'include/ass.h'
      - 'pkg/appfont*.ttf'
      - 'pkg/fonts/subs/**'
      - 'pkg/OFL.txt'
      - 'THIRD-PARTY-NOTICES.md'
      - 'licenses/**'
      - 'ci/check-tizen-so.py'
      - 'ci/testdata/tizen60-armv7-abi.json'
      - 'ci/nightly.py'
      - 'ci/check-staticlib-artifact.py'
      - 'ci/test_tizen_so_check.py'
      - 'ci/test_tizen_package.py'
      - 'ci/dependencies.json'
      - 'ci/deps.py'
      - 'tools/tizen-log-receiver.py'
  pull_request:
    paths: *tizen_paths
  workflow_dispatch:
    inputs:
      emulator-package:
        description: Produce the x86_64 nightly package for a manual emulator smoke test
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tizen-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tizen-so:
    name: Tizen library (link and verify, no emulator)
    runs-on: ubuntu-24.04
    # A cold run builds the application crate for x86_64 Linux (the dependency tree has no cache the first time), the two SDL archives
    # (~2 min) and links; the apt step is bounded by its own timeout-minutes below. Unmeasured on CI at the time of writing (no run existed):
    # the limit is a generous cold-cache bound, and the first runs' wall times replace it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install the GLES2 development library the link names
        # `-lGLESv2` resolves against libGLESv2.so (the .so symlink is in -dev only). The television has no such package: the library
        # needs `libGLESv2.so.2` at run time and the Tizen image provides it (inventory D3). cmake and pkg-config build the renderer's
        # static font stack (ci/build-libass.py). Bounded apt path, as every job here.
        timeout-minutes: 15
        uses: ./.github/actions/apt-install
        with:
          packages: libgles-dev binutils cmake pkg-config

      # The pinned Rust toolchain, the cargo cache, and (sdl: "true") the desktop SDL/GL development packages that LINK the crate's own host
      # test binary (build.rs links them for every host test binary). The library itself links NONE of them: its SDL is built from the
      # pinned archives by `make tizen-sdl` into tizen/sdl-build, and `tizen-verify` fails the job if a libSDL2 shows up in DT_NEEDED.
      - uses: ./.github/actions/host-rust
        with:
          sdl: "true"

      - id: toolchain
        name: Identify the host toolchain
        run: echo "id=$(./ci/host-toolchain-id.sh)" >> "$GITHUB_OUTPUT"

      - name: Cache the host libass stack
        # The emulator's renderer is ci/build-libass.py's host build, the one the Linux simulator job builds, so this is THAT job's entry
        # (simulators.yml, same path and key): a hit skips the static FreeType/FriBidi/HarfBuzz/libunibreak/libass build and only the
        # facade relinks. The script still re-checks its own content stamp, so a stale entry rebuilds rather than ships.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/libass-prefix-host
          key: host-libass-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('ci/build-libass.sh', 'ci/build-libass.py', 'ci/dependencies.json', 'ci/deps.py', 'ci/arm-cc.py', 'ci/check-link-evidence.py', 'ci/stage-link-evidence.py', 'ci/patches/libass-0001-grow-font-faces.patch', 'src/ass.c', 'src/ass_text.c', 'src/ass_fonts.c', 'src/ass_internal.h', 'src/ass_composite.h', 'include/ass.h') }}

      - name: The configuration
        run: make PLATFORM=tizen print-tizen-config

      - name: The header and the .NET host agree on the exports
        run: make PLATFORM=tizen tizen-abi

      - name: Build the library (static SDL2 + SDL2_ttf, the platform staticlib, the link) and the subtitle renderer
        run: make PLATFORM=tizen tizen-so

      - name: Verify the library and the renderer (DT_NEEDED allowlists, undefined symbols, exports, glibc ceiling)
        run: make PLATFORM=tizen tizen-verify

      - name: The platform crate's own host tests with the Tizen feature
        # The pattern followed is `ci.yml`'s host unit job: `cargo test --lib -p <crates>` from rust-modules, on the pinned toolchain. That job
        # already runs `plx_platform_tizen` with its DEFAULT features, where the crate's library is empty; this pass adds the crate's own tests
        # (`#[cfg(feature = "tizen")]`), which no other job compiles. It is a separate cargo invocation from the staticlib build above: that is
        # `cargo rustc --crate-type staticlib` into target-tizen, this is an ordinary test build into target/.
        run: cd rust-modules && cargo "+$RUST_TOOLCHAIN" test --lib -p plx_platform_tizen --features tizen

      - name: The platform crate's host tests with the Tizen URI driver
        # The `uri` feature (W10 part B: `player/`, the driver, the qualifier and the composition) adds code and tests the pass above does not
        # compile, and the shipped library is built WITH it (`TIZEN_URI` defaults to 1), so its host tests run here too. The pass above stays as it is: it
        # is the build without the driver, which `TIZEN_URI=0` still makes.
        run: cd rust-modules && cargo "+$RUST_TOOLCHAIN" test --lib -p plx_platform_tizen --features tizen,uri

  tizen-armv7:
    name: Samsung ARMv7 package
    uses: ./.github/workflows/tizen-package.yml
    with:
      ref: ${{ github.sha }}

  tizen-emulator-package:
    name: Tizen emulator smoke test package
    if: github.event_name == 'workflow_dispatch' && inputs.emulator-package
    uses: ./.github/workflows/tizen-package.yml
    with:
      ref: ${{ github.sha }}
      arch: x86_64
