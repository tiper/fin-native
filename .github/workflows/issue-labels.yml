name: Issue labels

# The same Pullfrog run classifies and handles first-line issue support.
# Shadow is the default. Turn off native Enrich and Label before choosing public.
on:
  issues:
    types: [opened, reopened, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issues:
        description: Issue numbers separated by spaces, or unlabeled.
        required: true
        type: string
      dry_run:
        description: Show proposed labels and triage in Actions without writing to issues.
        type: boolean
        default: true

permissions: {}

jobs:
  select:
    name: select issues
    if: >-
      github.event_name != 'issue_comment' ||
      (vars.PLXNATIVE_ISSUE_SUPPORT == 'public' && !github.event.issue.pull_request &&
      github.event.issue.state == 'open' && github.event.comment.user.type == 'User' &&
      github.event.comment.user.id == github.event.issue.user.id)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      issues: ${{ steps.select.outputs.issues }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            ci/label-issue.py
            ci/issue_support.py
          sparse-checkout-cone-mode: false
      - name: Resolve issue numbers
        id: select
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ISSUE: ${{ github.event.issue.number }}
          INPUT_ISSUES: ${{ inputs.issues }}
          DRY_RUN: ${{ inputs.dry_run }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == workflow_dispatch ]]; then
            if [[ "$DRY_RUN" != true && "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
              echo '::error::Use the default branch to apply issue labels.'
              exit 1
            fi
            python3 ci/label-issue.py select "$INPUT_ISSUES"
          elif [[ "$ACTION" == edited ]]; then
            python3 ci/label-issue.py select "$ISSUE" --only-if-unlabeled
          else
            python3 ci/label-issue.py select "$ISSUE"
          fi

  triage:
    name: 'triage issue #${{ matrix.issue.number }}'
    needs: select
    if: needs.select.outputs.issues != '[]'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        issue: ${{ fromJSON(needs.select.outputs.issues) }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
      id-token: write
    uses: ./.github/workflows/triage-issue.yml
    with:
      number: ${{ matrix.issue.number }}
      only_if_unlabeled: ${{ matrix.issue.only_if_unlabeled }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      support_mode: >-
        ${{ github.event_name == 'issue_comment' && 'public' ||
        github.event_name == 'issues' && github.event.action == 'opened' && (vars.PLXNATIVE_ISSUE_SUPPORT || 'shadow') ||
        github.event_name == 'workflow_dispatch' && inputs.dry_run && 'preview' || 'off' }}
      comment_id: ${{ github.event.comment.id || 0 }}
